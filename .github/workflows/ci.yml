name: API Tests CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Clone test-service (API server)
        run: |
          git clone https://github.com/sun6r0/test-service.git
          cd test-service
          # Опционально: переключиться на конкретный коммит/ветку
          # git checkout some-branch-or-tag

      - name: Start API server with Docker Compose
        run: |
          cd test-service
          docker-compose up -d --build
          sleep 30   # даём серверу время подняться

      - name: Run tests
        run: mvn clean test

      - name: Stop Docker Compose
        if: always()
        run: |
          cd test-service
          docker-compose down

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/